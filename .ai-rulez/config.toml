# AI-Rulez Configuration
# Directory-based configuration with domain scoping
# Documentation: https://github.com/Goldziher/ai-rulez

# Version (required)
version = "4.0"

# Project name (required)
name = "decode"

# Description
description = "AI-powered development governance for FTC decode project"

# Presets: built-in tools or custom outputs
# Built-in presets: claude, cursor, windsurf, copilot, gemini, cline, continue-dev, junie, codex, antigravity
presets = ["claude", "copilot", "codex", "antigravity"]

# Gitignore management
gitignore = false

