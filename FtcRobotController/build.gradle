plugins {
    id 'com.android.library'
}

import java.text.SimpleDateFormat

//
// build.gradle in FtcRobotController
//
// apply plugin: 'com.android.library'

android {

    defaultConfig {
        minSdkVersion 24
        def appBuildTime = project.hasProperty('updateBuildTime')
                ? new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ", Locale.ROOT).format(new Date())
                : "2026-01-01T00:00:00.000+0000"
        buildConfigField "String", "APP_BUILD_TIME", '"' + appBuildTime + '"'

    }

    buildFeatures {
        buildConfig = true
    }

    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    namespace = 'com.qualcomm.ftcrobotcontroller'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
}

apply from: '../build.dependencies.gradle'
