max_power_output:
  desc: "Maximum power limit (0.0 to 1.0) commanded to the turret CRServo. Limits maximum turret rotation speed."
  min: 0.0
  max: 1.0

ks:
  desc: "Static friction compensation power (0.0 to 1.0) added to turret rotation to overcome gear backlash and stiction. Applied in the direction of movement."
  min: 0.0
  max: 1.0

servo_direction_inverted:
  desc: "Flips which CRServo direction counts as increasing turret angle. Set this (not the analog encoder's 'inverted' flag) when the turret drives away from its target."

min_angle:
  desc: "Most negative turret angle (degrees, relative to the chassis) the turret is allowed to reach."
  min: -180.0
  max: 0.0

max_angle:
  desc: "Most positive turret angle (degrees, relative to the chassis) the turret is allowed to reach."
  min: 0.0
  max: 180.0

full_scale_voltage:
  desc: "Full electrical span (volts) of the turret potentiometer, i.e. the voltage at which it wraps back to zero."
  min: 0.0

aim_hysteresis:
  desc: "Multiplier applied to the aim tolerance to decide when the turret leaves the 'aimed' state. 1.0 disables hysteresis and makes the turret chatter on the tolerance boundary; 2.0 means it must drift to twice the tolerance before driving again."
  min: 1.0

timeout_sec:
  desc: "Seconds the turret may be actively commanded to move without measurable progress before a stiction kick is applied."
  min: 0.0

kick_power:
  desc: "Power applied once a stall is detected, in place of the normal PIDF command, to break static friction."
  min: 0.0

progress_deg:
  desc: "Angular movement that counts as 'making progress' and resets the stall timer."
  min: 0.0

max_drift:
  desc: "Maximum allowed chassis drift (inches) from target pose before auto-corrective drive motions engage."
  min: 0.0

near_cutoff:
  desc: "Distance boundary (inches) below which the target is considered close, switching to static tolerance."
  min: 0.0

near_val:
  desc: "Target alignment tolerance (degrees) when within the near cutoff range."
  min: 0.0

min_deg:
  desc: "Minimum dynamic alignment tolerance (degrees) allowed. Prevents the turret from hunting indefinitely when very close."
  min: 0.0

max_deg:
  desc: "Maximum dynamic alignment tolerance (degrees) allowed. Prevents launching if the turret orientation error exceeds this."
  min: 0.0

logo:
  desc: "Mounting orientation direction of the hub's logo panel (e.g. RIGHT, LEFT, UP, DOWN, FORWARD, BACKWARD)."

usb:
  desc: "Mounting direction of the hub's USB ports."

robot_width:
  desc: "Total physical width of the robot (inches) used to build the collision footprint. Determines how close the robot can get to walls or goals."
  min: 0.0

rotation_lookahead_time:
  desc: "Time horizon (seconds) used to project future rotation based on live angular velocity (|omega| * time). Seeded at 0.075s (derived from 0.45rad / assumed 6.0rad/s max omega); calibrate on robot using Friction Calibration TeleOp."
  min: 0.0

size:
  desc: "Length (inches) of one side of the square scoring goal zones on the field."
  min: 0.0

min_y:
  desc: "The Y-coordinate boundary (inches) on the field where the scoring zones begin. Used to calculate red/blue alliance goal boxes."
  min: 0.0

red_goal_x:
  desc: "Goal center X coordinate for RED alliance."
  min: 0.0

red_goal_y:
  desc: "Goal center Y coordinate for RED alliance."
  min: 0.0

blue_goal_x:
  desc: "Goal center X coordinate for BLUE alliance."
  min: 0.0

blue_goal_y:
  desc: "Goal center Y coordinate for BLUE alliance."
  min: 0.0

power:
  desc: "Motor power (0.0 to 1.0) commanded to push the robot away when it violates a goal zone boundary. Driver/safety policy parameter."
  min: 0.0
  max: 1.0

decel_safety_factor:
  desc: "Safety margin factor (0.0 to 1.0) for predictive braking (e.g. 0.7 = 30% safety margin over physics model prediction). Risk tolerance/policy parameter."
  min: 0.0
  max: 1.0

slow_down:
  desc: "Distance (inches) from goal zone at which proximity speed reduction starts. Driver comfort / early-warning feel parameter."
  min: 0.0

hard_stop:
  desc: "Distance (inches) from goal zone where drive power towards zone is cut to zero. Safety policy parameter."
  min: 0.0

enable_depth_protection:
  desc: "Enable/disable depth (X-axis) goal zone proximity protection. Safety policy parameter; leave true outside of debugging."

enable_side_protection:
  desc: "Enable/disable side (Y-axis) goal zone proximity protection. Safety policy parameter; leave true outside of debugging."

lane_blend_distance:
  desc: "Distance (inches) over which safety slows downs are interpolated from 0% to 100% strength to prevent jerky speed changes."
  min: 0.0

x:
  desc: "X value coordinate."

y:
  desc: "Y value coordinate."

z:
  desc: "Z value coordinate."

yaw:
  desc: "Yaw rotation (degrees)."

pitch:
  desc: "Pitch rotation (degrees)."

roll:
  desc: "Roll rotation (degrees)."

rot:
  desc: "Minimum turn/yaw drive power (0.0 to 1.0) needed to overcome static wheel stiction. Calibrated using Friction Calibration OpMode."
  min: 0.0
  max: 1.0
  suppress_similarity_check: true

time:
  desc: "Joystick input filter time constant (seconds). Higher values make acceleration and deceleration smoother but increase input lag."
  min: 0.0
  suppress_similarity_check: true

back_lift_multiplier:
  desc: "Divisor scaling factor for deceleration. Divides the deceleration rate when stopping to slow down the deceleration curve, preventing the robot from tipping forward and lifting its back wheels."
  min: 0.0

enabled:
  desc: "Enable/disable automatic heading lock when the driver releases the turn joystick in TeleOp."

intent_threshold:
  desc: "Raw joystick turn threshold (0.0 to 1.0) above which driver active steering takes control and disengages heading lock."
  min: 0.0
  max: 1.0

ks_moving:
  desc: "Minimum rotational drive power (0.0 to 1.0) needed to overcome friction while the robot is already translating."
  min: 0.0
  max: 1.0

moving_speed_threshold:
  desc: "Chassis translational speed threshold (inches/sec) above which full ks_moving friction feedforward is applied."
  min: 0.0

max_power:
  desc: "Maximum motor power (0.0 to 1.0) the loop is allowed to command. Clamped to be completely imperceptible."
  min: 0.0

error_deadband_deg:
  desc: "Heading error (degrees) below which heading lock applies zero correction, to avoid chattering/jitter from sensor noise while holding a heading at rest."
  min: 0.0
  max: 15.0

settle_rate_dps:
  desc: "Rotation rate (degrees/sec) below which the robot counts as settled. Heading lock waits for this before capturing the heading to hold, so it does not latch mid-coast and fight the robot's own momentum."
  min: 0.0

max_rpm:
  desc: "Maximum rotational speed (RPM) of the motor. Used to scale power percentage to velocity."
  min: 0.0

min_transfer_threshold:
  desc: "Flywheel speed threshold (percentage, 0.0 to 1.0) required to trigger the transfer belt. Prevents launching rings before the shooter is up to speed."
  min: 0.0
  max: 1.0

low_position:
  desc: "Hood servo low/retracted position coefficient (0.0 to 1.0) for short-range shots."
  min: 0.0
  max: 1.0

high_position:
  desc: "Hood servo high/extended position coefficient (0.0 to 1.0) for long-range shots."
  min: 0.0
  max: 1.0

p:
  desc: "Proportional gain."

i:
  desc: "Integral gain."

d:
  desc: "Derivative gain."

f:
  desc: "Feedforward gain."

threshold_distance:
  desc: "Distance boundary (inches) separating close-range shots from long-range shots."
  min: 0.0

launch_power:
  desc: "Flywheel power ratio (0.0 to 1.0) used for close-range shots."
  min: 0.0
  max: 1.0

wait_time:
  desc: "Delay (milliseconds) to keep the flywheel running after firing a near shot."
  min: 0.0

blue_base_power:
  desc: "Base flywheel power ratio (0.0 to 1.0) for Blue alliance shots beyond the threshold distance."
  min: 0.0
  max: 1.0

red_base_power:
  desc: "Base flywheel power ratio (0.0 to 1.0) for Red alliance shots beyond the threshold distance. Red shoots from farther away so this value is intentionally higher."
  min: 0.0
  max: 1.0

power_scale:
  desc: "Distance divisor (inches) to scale up flywheel power as distance increases (power = base_power + extra_distance / power_scale)."
  min: 0.0

wait_time_scale:
  desc: "Multiplier converting distance to run-time (wait_time = distance * wait_time_scale) in milliseconds."
  min: 0.0

drink_wait_ms:
  desc: "Wait delay (milliseconds) at the drink gate when intake gathers rings."
  min: 0

shoot_wait_ms:
  desc: "Wait time (milliseconds) allowed to fire a shot before ending the shoot command."
  min: 0

transfer_power:
  desc: "Target power coefficient (0.0 to 1.0) for autonomous transfer motor."
  min: 0.0
  max: 1.0

opposite_drink_wait_ms:
  desc: "Wait delay (milliseconds) at the drink gate for opposite alliance autonomous."
  min: 0

opposite_shoot_wait_ms:
  desc: "Wait time (milliseconds) allowed to fire a shot for opposite alliance autonomous."
  min: 0

opposite_launch_power:
  desc: "Target power coefficient (0.0 to 1.0) for opposite alliance autonomous launcher."
  min: 0.0
  max: 1.0

opposite_transfer_power:
  desc: "Target power coefficient (0.0 to 1.0) for opposite alliance autonomous transfer."
  min: 0.0
  max: 1.0

start:
  desc: "Starting position coordinate pose."

score:
  desc: "High goal target scoring position coordinate pose."

final_score:
  desc: "Final scoring target position coordinate pose."

drink_cp:
  desc: "Control point pose on path to drink gate."

drink_end:
  desc: "Ending position coordinate pose at the drink gate."

pickup1_cp:
  desc: "Control point pose on path to first sample pickup."

pickup1_end:
  desc: "Ending position coordinate pose for first sample pickup."

pickup2_cp:
  desc: "Control point pose on path to second sample pickup."

pickup2_end:
  desc: "Ending position coordinate pose for second sample pickup."

pickup3_cp:
  desc: "Control point pose on path to third sample pickup."

pickup3_end:
  desc: "Ending position coordinate pose for third sample pickup."

pickup4_cp:
  desc: "Control point pose on path to fourth sample pickup."

pickup4_end:
  desc: "Ending position coordinate pose for fourth sample pickup."

park:
  desc: "Parking destination coordinate pose."

drink:
  desc: "Drink gate alignment coordinate pose."

max_speed:
  desc: "Maximum speed scaler (0.0 to 1.0) applied to chassis manual TeleOp drive inputs."
  min: 0.0
  max: 1.0

zero_voltage:
  desc: "Analog voltage (V) corresponding to 0 degree turret angle position."
  min: 0.0
  max: 3.3

degrees_per_volt:
  desc: "Scale factor (degrees/volt) converting analog input voltage delta to turret angle in degrees."

min_voltage:
  desc: "Minimum safe voltage limit for the analog encoder."
  min: 0.0
  max: 3.3

max_voltage:
  desc: "Maximum safe voltage limit for the analog encoder."
  min: 0.0
  max: 3.3

inverted:
  desc: "True if increasing turret angle produces decreasing analog voltage."

max_velocity_threshold:
  desc: "Flywheel velocity upper bound scale factor (e.g. 1.05) to prevent overshooting before feeding rings."
  min: 1.0
  max: 2.0

feed_intake_power:
  desc: "Front intake power (0.0 to 1.0) when feeding rings to the shooter."
  min: 0.0
  max: 1.0

feed_transfer_power:
  desc: "Transfer motor power (0.0 to 1.0) when feeding rings to the shooter."
  min: 0.0
  max: 1.0

long_hood_power_threshold:
  desc: "Launch power ratio threshold above which the high hood position is selected for long-range shots."
  min: 0.0
  max: 1.0

intake_power:
  desc: "Target motor power (0.0 to 1.0) for intake rollers in TeleOp."
  min: 0.0
  max: 1.0
  suppress_similarity_check: true

manual_rev_power:
  desc: "Target flywheel power ratio (0.0 to 1.0) for manual rev command in TeleOp."
  min: 0.0
  max: 1.0
