shooter:
  use_ftc_pid: true
  ks: 0.1811
  nominal_voltage: 12.0
  max_voltage_compensation: 1.4
  voltage_refresh_sec: 0.25
  max_rpm: 1500
  constant_rpm: 1000
  min_transfer_threshold: 0.97
  max_velocity_threshold: 1.03
  feed_release_threshold: 0.80
  feed_intake_power: 1.0
  feed_transfer_power: 1.0
  long_hood_power_threshold: 0.7
  ball_detection:
    # Same thresholds the Shot Timing Tuner settled on: real balls measured 12.2%-26.4% deep on this
    # robot's flywheel, the deepest non-ball (post-shot coast-down) reached 5.4%, so 9% sits in the
    # clear gap between them. See FlywheelDipDetector for the detection algorithm.
    dip_fraction: 0.09
    rebound_fraction: 0.05
    baseline_alpha: 0.03
    refractory_ms: 120
  pidf:
    p: 0.0001472
    i: 0.0008
    d: 0
    f: 16.0744
  motor_pidf:
    # REV firmware velocity PIDF for RUN_USING_ENCODER (use_ftc_pid: true), applied to the motor
    # directly via DcMotorEx.setPIDFCoefficients — distinct from shooter.pidf above, which only
    # feeds the software PIDFController used when use_ftc_pid is false, and is never sent to the
    # motor. These are the values from the last known-working competition build (I=0, so no
    # integral to wind up during a feed and fling the wheel past setpoint once the ball leaves).
    # f is rescaled from that build's 22.8 @ max_rpm=1450 to this robot's max_rpm=1500
    # (22.8 * 1450/1500 = 22.04) since firmware F is referenced to max_rpm; retune if it undershoots.
    p: 150
    i: 0
    d: 0
    f: 22.04
  integral:
    band_ticks: 150.0
    max_contribution: 0.15
  ballistics:
    v0: 250.0
    k: 0.0012
    magnus_l: 0.015
    launch_height_inches: 15.0
    goal_height_inches: 45.0
    g_inches_per_sec2: 386.088
    min_hood_angle_deg: 15.0
    max_hood_angle_deg: 65.0
    min_hood_servo_pos: 0.85
    max_hood_servo_pos: 0.0
    max_moving_speed_ips: 60.0
    min_valid_distance: 30.0
    max_valid_distance: 150.0
    lead_bias_gain: 1.0
    v0_reference_rpm: 1000.0
    preferred_shot_rpm: 1000.0
    max_shot_rpm: 1450.0
    v0_margin_fraction: 0.12
    rpm_update_deadband: 25.0
    flight_time_sec_per_inch: 0.004
    lead_min_speed_ips: 10.0
  shot_table:
    # Measured shots, flat triples: distance_in, hood_servo, flywheel_rpm.
    # Recorded by the Ballistics Calibration OpMode; distances must strictly increase.
    # Linear interpolation between rows, clamped outside them.
    #
    # From the 2026-08-08 00:31 run. Six rows, every one a shot the driver watched score, no
    # skips. Two things improved over the 22:37 run this replaces: the close endpoint is no longer
    # clamped (50.1 sits at servo 0.1009, where 47.9 was hard against 0.0000 with no steeper hood
    # left to try), and 137.0 was reached instead of skipped. Range is now 50.1 - 137.0 in.
    #
    # RPM is clean: 950 -> 989 -> 1101 -> 1179 -> 1282 -> 1382, monotonic with a smoothly rising
    # slope of 1.7 to 9.4 rpm/in.
    #
    # The servo column still reverses at 97.9 -> 113.7 (0.6488 -> 0.5196), the same dip the 22:37
    # run showed at 96.7 -> 114.7 (0.6615 -> 0.5139). Landing twice within ~0.015 is NOT
    # independent confirmation: each endpoint is seeded from this table, so the driver was
    # accepting a number that came from the previous run. What the reversal costs is real though —
    # interpolating that segment sweeps the hood steeper while sweeping the flywheel faster, a
    # pairing never tested anywhere in between. At a fixed distance a whole family of
    # (servo, rpm) pairs scores, and each endpoint picked a different member of it. Pinning RPM
    # across every endpoint and moving only the hood collapses that family to a single curve, and
    # is the run that would actually settle whether this dip is real.
    points: [
        50.1, 0.1009, 950.0,
        72.6, 0.2191, 989.0,
        97.9, 0.6488, 1101.0,
        113.7, 0.5196, 1179.0,
        124.7, 0.6139, 1282.0,
        137.0, 0.7139, 1382.0
      ]

auto:
  # Flat distance_in, shoot_window_ms pairs, from the Shot Timing Tuner at the 9% dip trigger and
  # after shooter.motor_pidf killed the post-shot overshoot (see that key's doc). Re-measured
  # 2026-08-08 against the fixed detector; the previous points here were contaminated by a false
  # trigger on the wheel's coast-down and were all too short.
  #
  # This table is now a SAFETY-NET TIMEOUT, not the primary end condition: ShotController counts
  # balls itself via shooter.ball_detection and ends the shot at auto.balls_per_shot_count, whichever
  # comes first. A shot that runs its full window without reaching the count means something
  # actually jammed, not that the window was mis-measured.
  shot_time_points: [
      52.0, 1028,
      68.0, 2056,
      86.0, 1181,
      104.0, 1911,
      122.0, 4209,
      136.0, 4014
    ]
  balls_per_shot_count: 3
  drink_wait_ms: 1200
  shoot_wait_ms: 1300
  launch_power: 0.71
  transfer_power: 0.12
  opposite_drink_wait_ms: 1250
  opposite_shoot_wait_ms: 2450
  opposite_launch_power: 0.86
  opposite_transfer_power: 0.12

